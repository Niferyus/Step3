version: '3.8'
services:
  gatewayapi:
    build:
      context: .
      dockerfile: GatewayAPI/Dockerfile
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      - authapi
      - productapi

  authapi:
    build:
      context: ./Services/Auth
      dockerfile: API/Dockerfile
    ports:
      - "5020:80"
      - "5443:443"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development

  productapi:
    build:
      context: ./Services/Product
      dockerfile: API/Dockerfile
    ports:
      - "8082:8080"
      - "8083:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
